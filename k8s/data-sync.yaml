# Helper pod for looking inside the data volume (kubectl exec ls / cat).
# Pinned to dkbl2 so the PVC binds there. No GPU. Not used for transfers
# any more: sync-data.sh rsyncs over SSH straight into the PVC directory on
# dkbl2. Delete it when done: kubectl -n iran-sentiment delete pod data-sync
apiVersion: v1
kind: Pod
metadata:
  name: data-sync
  namespace: iran-sentiment
  labels:
    app.kubernetes.io/name: iran-sentiment
    app.kubernetes.io/component: data-sync
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: dkbl2
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: sync
      image: busybox:1.37
      command: ["sh", "-c", "mkdir -p /data/processed /data/raw/truthsocial /data/models && sleep infinity"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: iran-sentiment-data
