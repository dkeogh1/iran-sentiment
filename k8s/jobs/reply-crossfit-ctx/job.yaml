apiVersion: batch/v1
kind: Job
metadata:
  name: iran-reply-crossfit-ctx
  namespace: iran-sentiment
  labels:
    app.kubernetes.io/name: iran-sentiment
    app.kubernetes.io/component: reply-crossfit-ctx
spec:
  backoffLimit: 0
  # 10 h: ten folds on ~10,300 labels each, ~4-5 h estimated (2026-11-23).
  activeDeadlineSeconds: 36000
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iran-sentiment
        app.kubernetes.io/component: reply-crossfit-ctx
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: dkbl2
      runtimeClassName: nvidia
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: reply-crossfit-ctx
          image: iran-sentiment
          imagePullPolicy: IfNotPresent
          args: ['reply-distill', '--crossfit', '--variant', 'ctx']
          envFrom:
            - secretRef:
                name: iran-sentiment-env
                optional: true
          env:
            - name: IRAN_DATA_DIR
              value: /data
            - name: HF_HOME
              value: /data/hf
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
            limits:
              memory: 20Gi
              nvidia.com/gpu: 1
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: iran-sentiment-data
